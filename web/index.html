<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111820">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="收益日历">
  <title>IBKR 收益日历</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="title-block">
      <h1 id="pageTitle">资产盈亏分析</h1>
      <div class="sub" id="updated">加载中…</div>
    </div>
    <button class="icon-btn" id="refreshBtn" title="从 IBKR 拉取最新数据">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>

  <div class="banner hidden" id="banner"></div>

  <nav class="chips scroll" id="accountChips"></nav>

  <nav class="chips" id="rangeChips">
    <button data-range="1m">近1月</button>
    <button data-range="6m">近6月</button>
    <button data-range="ytd">本年</button>
    <button data-range="1y">近1年</button>
    <button data-range="all">全部</button>
    <button data-range="custom" class="icon-chip" title="自定义区间">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 4h18l-7 8.5V19l-4 2v-8.5z"/></svg>
    </button>
  </nav>
  <div class="custom-range hidden" id="customRange">
    <input type="date" id="customStart"> <span>至</span> <input type="date" id="customEnd">
    <button class="btn" id="customApply">确定</button>
  </div>

  <!-- ============ 首页 ============ -->
  <main id="homeView" class="view">
    <section class="card" id="summaryCard">
      <div class="range-label" id="rangeLabel"></div>
      <div class="headline">
        <div>
          <div class="label">区间盈亏 (<span class="ccy"></span>)</div>
          <div class="big" id="sumPnl">--</div>
        </div>
        <div class="right">
          <div class="label">区间收益率</div>
          <div class="mid" id="sumRet">--</div>
        </div>
      </div>
      <svg class="spark" id="spark" preserveAspectRatio="none"></svg>
      <div class="stats">
        <div><span class="label">盈利天数</span><b id="winDays">--</b></div>
        <div><span class="label">亏损天数</span><b id="lossDays">--</b></div>
        <div><span class="label">最大单日盈利</span><b id="bestDay">--</b></div>
        <div><span class="label">最大单日亏损</span><b id="worstDay">--</b></div>
        <div><span class="label">区间净入金</span><b id="netFlow">--</b></div>
        <div><span class="label">期末资产</span><b id="endNav">--</b></div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>收益日历 (<span class="ccy"></span>)</h2>
      </div>
      <div class="cal-toolbar">
        <div class="period-nav">
          <button class="icon-btn sm" id="prevBtn" aria-label="上一个">‹</button>
          <label class="period-picker">
            <span id="periodText"></span> <small>▾</small>
            <input type="month" id="monthInput">
            <select id="yearInput"></select>
          </label>
          <button class="icon-btn sm" id="nextBtn" aria-label="下一个">›</button>
        </div>
        <div class="toggles">
          <div class="seg" id="viewSeg"><button data-v="year">年</button><button data-v="month">月</button></div>
          <div class="seg" id="metricSeg"><button data-v="pnl">收益</button><button data-v="ret">收益率</button></div>
        </div>
      </div>

      <div id="calendar"></div>
      <div class="period-total" id="periodTotal"></div>
      <div class="day-detail hidden" id="dayDetail"></div>
    </section>

    <section class="card">
      <a class="card-head link" href="#/ranking">
        <h2><span class="range-name"></span>已实现盈亏排行 (<span class="ccy"></span>)</h2>
        <span class="more">›</span>
      </a>
      <div class="versus" id="versus"></div>
      <div class="seg wide" id="topSeg"><button data-v="win">盈利 Top5</button><button data-v="loss">亏损 Top5</button></div>
      <div class="rank-head"><span>排行榜</span><span>盈亏总额</span></div>
      <div class="rank-list" id="topList"></div>
    </section>
  </main>

  <!-- ============ 排行榜 ============ -->
  <main id="rankingView" class="view hidden">
    <div class="seg wide" id="rankSeg"><button data-v="win">盈利</button><button data-v="loss">亏损</button></div>
    <section class="card">
      <div class="rank-range" id="rankRange"></div>
      <h2>已实现盈亏详情 (<span class="ccy"></span>)</h2>
      <div class="rank-head">
        <span>排行榜</span>
        <button class="sort-btn" id="rankSort">盈亏总额 <span id="rankSortIcon">▼</span></button>
      </div>
      <div class="rank-list" id="rankList"></div>
      <div class="rank-total" id="rankTotal"></div>
    </section>
  </main>

  <!-- ============ 订单查询 ============ -->
  <main id="ordersView" class="view hidden">
    <div class="search">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="orderSearch" placeholder="请输入证券名称或代码的关键字" autocomplete="off">
    </div>
    <div class="order-filters">
      <select id="orderSide"><option value="">全部方向</option><option value="BUY">买入</option><option value="SELL">卖出</option></select>
      <select id="orderAsset"><option value="">全部品种</option><option value="STK">股票/ETF</option><option value="OPT">期权</option><option value="OTHER">其他</option></select>
      <span class="label" id="orderCount"></span>
    </div>
    <section class="card orders">
      <div class="order-row head">
        <span>名称/代码</span><span class="r">总量/成交价</span><span class="r">方向/状态</span><span class="r">时间</span>
      </div>
      <div id="orderList"></div>
      <button class="btn more-btn hidden" id="orderMore">加载更多</button>
    </section>
  </main>

  <footer class="foot">
    <label><input type="checkbox" id="redUp"> 红涨绿跌</label>
    <span id="footInfo"></span>
  </footer>
</div>
<nav class="tabbar" id="tabbar">
  <a href="#/" data-route="home">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 14h2M14 14h2M8 17.5h2"/></svg>
    <span>收益</span>
  </a>
  <a href="#/ranking" data-route="ranking">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11M10 20V5M16 20v-6M22 20H2"/></svg>
    <span>排行</span>
  </a>
  <a href="#/orders" data-route="orders">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
    <span>订单</span>
  </a>
</nav>
<script src="app.js"></script>
</body>
</html>
